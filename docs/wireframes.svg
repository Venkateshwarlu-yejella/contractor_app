<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Site Saathi phone wireframes</title><desc id="desc">Three proposed phone screens: photo home, attendance and payment confirmation. Large worker photos and numeric buttons repeat across flows.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#183348}.title{font-size:28px;font-weight:bold}.heading{font-size:20px;font-weight:bold}.label{font-size:15px}.small{font-size:13px;fill:#5d7282}.number{font-size:40px;font-weight:bold}.white{fill:white}.orange{fill:#a1431b}.muted{fill:#5d7282}</style></defs><rect width="1200" height="940" fill="#f4f7fa"/><text x="54" y="54" class="title">Site Saathi · phone wireframes</text><text x="54" y="82" class="label muted">The same photo, numbers and confirmation pattern on every screen.</text>
<g transform="translate(55 123)"><text x="0" y="0" class="heading">01  Photo home</text><rect x="0" y="24" width="330" height="652" rx="28" fill="white" stroke="#b6c6d2" stroke-width="2"/><rect x="1" y="25" width="328" height="66" rx="27" fill="#183348"/><rect x="1" y="58" width="328" height="33" fill="#183348"/><text x="23" y="68" class="heading white">site saathi</text><text x="254" y="68" class="label white">Voice</text><text x="24" y="131" class="heading">Today</text><text x="24" y="157" class="label muted">5 September · Saturday</text>
<rect x="23" y="185" width="134" height="158" rx="14" fill="#e8f3ec" stroke="#9abbab"/><text x="90" y="251" text-anchor="middle" class="number">✓</text><text x="90" y="304" text-anchor="middle" class="label">Attendance</text><rect x="173" y="185" width="134" height="158" rx="14" fill="#fff0e5" stroke="#dab398"/><text x="240" y="251" text-anchor="middle" class="number">₹</text><text x="240" y="304" text-anchor="middle" class="label">Payment</text><rect x="23" y="364" width="284" height="130" rx="14" fill="#edf3f8" stroke="#b9cbd9"/><text x="165" y="420" text-anchor="middle" class="number">₹ 1,950</text><text x="165" y="465" text-anchor="middle" class="label">Balances</text><line x1="0" x2="330" y1="589" y2="589" stroke="#d9e2e9"/><text x="37" y="624" class="label">Home</text><text x="126" y="624" class="label">Photos</text><text x="234" y="624" class="label">Pay</text><text x="23" y="716" class="small">Three large daily actions.</text><text x="23" y="739" class="small">Brother sets up sites and workers.</text></g>
<g transform="translate(435 123)"><text x="0" y="0" class="heading">02  Attendance</text><rect x="0" y="24" width="330" height="652" rx="28" fill="white" stroke="#b6c6d2" stroke-width="2"/><text x="24" y="72" class="heading">Who’s on site?</text><rect x="23" y="98" width="284" height="57" rx="10" fill="#fff0e5" stroke="#bf5429"/><text x="40" y="132" class="label">01  Site photo / familiar name</text><rect x="23" y="182" width="134" height="193" rx="13" fill="#f5f8fa" stroke="#bfd0db"/><rect x="47" y="200" width="85" height="102" rx="9" fill="#dfe8ee"/><text x="90" y="246" text-anchor="middle" class="small">Worker</text><text x="90" y="269" text-anchor="middle" class="small">photo</text><text x="90" y="332" text-anchor="middle" class="label">Ramesh</text><text x="90" y="356" text-anchor="middle" class="small">Tap to mark</text><rect x="173" y="182" width="134" height="193" rx="13" fill="#f5f8fa" stroke="#bfd0db"/><rect x="197" y="200" width="85" height="102" rx="9" fill="#dfe8ee"/><text x="240" y="246" text-anchor="middle" class="small">Worker</text><text x="240" y="269" text-anchor="middle" class="small">photo</text><text x="240" y="332" text-anchor="middle" class="label">Lakshmi</text><text x="240" y="356" text-anchor="middle" class="small">Tap to mark</text><text x="23" y="412" class="label">After choosing a photo</text><rect x="23" y="435" width="85" height="84" rx="10" fill="#e7f3ec" stroke="#8caf9a"/><text x="66" y="483" text-anchor="middle" class="number">1</text><rect x="123" y="435" width="85" height="84" rx="10" fill="#edf3f8" stroke="#bfd0db"/><text x="166" y="483" text-anchor="middle" class="number">½</text><rect x="223" y="435" width="85" height="84" rx="10" fill="#edf3f8" stroke="#bfd0db"/><text x="265" y="483" text-anchor="middle" class="number">0</text><rect x="23" y="551" width="284" height="74" rx="12" fill="#c34b1c"/><text x="165" y="598" text-anchor="middle" class="heading white">✓  Save attendance</text><text x="23" y="716" class="small">Full day, half day or absence.</text><text x="23" y="739" class="small">Expanded flow also supports two sites.</text></g>
<g transform="translate(815 123)"><text x="0" y="0" class="heading">03  Payment review</text><rect x="0" y="24" width="330" height="652" rx="28" fill="white" stroke="#b6c6d2" stroke-width="2"/><text x="24" y="72" class="heading">Confirm payment</text><rect x="109" y="111" width="112" height="140" rx="12" fill="#dfe8ee"/><text x="165" y="174" text-anchor="middle" class="label">Worker</text><text x="165" y="198" text-anchor="middle" class="label">photo</text><text x="165" y="286" text-anchor="middle" class="heading">Ramesh</text><text x="165" y="353" text-anchor="middle" class="number">₹ 1,000</text><rect x="67" y="382" width="196" height="50" rx="9" fill="#fff0e5" stroke="#dab398"/><text x="165" y="413" text-anchor="middle" class="label orange">Listen to amount</text><text x="165" y="470" text-anchor="middle" class="small">Still to pay after this</text><text x="165" y="508" text-anchor="middle" class="heading">₹ 950</text><rect x="23" y="549" width="98" height="75" rx="11" fill="#edf3f8" stroke="#b9cbd9"/><text x="72" y="594" text-anchor="middle" class="label">Back</text><rect x="137" y="549" width="170" height="75" rx="11" fill="#c34b1c"/><text x="222" y="594" text-anchor="middle" class="heading white">✓  ₹ 1,000</text><text x="23" y="716" class="small">Confirm the person and the amount.</text><text x="23" y="739" class="small">Success appears after the server saves.</text></g>
<text x="55" y="920" class="small">Layout specifications · Placeholder rectangles represent actual uploaded photos · No real worker records shown</text></svg>
